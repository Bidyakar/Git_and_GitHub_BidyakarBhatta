 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>To-Do Page</h2>
        <input
    type="number"
    id="itemId"
    placeholder="Item ID"
    required
>
        <form id="todoForm">
            <input type="text" id="itemName" placeholder="Item Name" required>
            <textarea id="itemDescription" placeholder="Item Description" required></textarea>
            <button type="submit">Add To-Do</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById("todoForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const itemName = document.getElementById("itemName").value;
            const itemDescription = document.getElementById("itemDescription").value;

            try {
                const response = await fetch("/submittodoitem", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ itemName, itemDescription })
                });

                const result = await response.json();
                document.getElementById("message").textContent = result.message;
            } catch (error) {
                document.getElementById("message").textContent = "Something went wrong.";
            }
        });
    </script>
</body>
</html>
